name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Descargar motor EPG de IPTV-org
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-src

      - name: Instalar dependencias EPG
        working-directory: epg-src
        run: npm ci --omit=optional

      - name: Preparar canales
        run: python build_epg.py

      - name: Generar EPG
        working-directory: epg-src
        run: npm run grab -- --channels=../custom.channels.xml --output=../guide.xml --lang=es --maxConnections=5

      - name: Mostrar faltantes
        run: |
          echo "=== tvg-id sin fuente EPG ==="
          if [ -s epg_missing.txt ]; then cat epg_missing.txt; else echo "Ninguno"; fi
          echo "=== guide.xml ==="
          test -s guide.xml && ls -lh guide.xml

      - name: Guardar guide.xml
        run: |
          git config user.name "epg-bot"
          git config user.email "actions@github.com"
          git add guide.xml epg_missing.txt
          git diff --cached --quiet || git commit -m "Actualizar EPG"
          git push
