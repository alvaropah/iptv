name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Descargar motor EPG IPTV-org
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: epg-src
          fetch-depth: 1

      - name: Instalar dependencias EPG
        working-directory: epg-src
        run: npm ci --omit=optional

      - name: Generar EPG Movistar+
        working-directory: epg-src
        continue-on-error: true
        run: |
          mkdir -p ../epg-local
          npm run grab -- --sites=movistarplus.es --lang=es --output=../epg-local/movistarplus.xml --maxConnections=5

      - name: Generar EPG Orange TV
        working-directory: epg-src
        continue-on-error: true
        run: |
          mkdir -p ../epg-local
          npm run grab -- --sites=orangetv.orange.es --lang=es --output=../epg-local/orangetv.xml --maxConnections=5

      - name: Generar EPG personalizado
        run: python build_epg.py

      - name: Guardar EPG y reportes
        run: |
          git config user.name "epg-bot"
          git config user.email "actions@github.com"
          git add guide.xml epg_missing.txt epg_mapping.txt
          git diff --cached --quiet || git commit -m "Actualizar EPG"
          git push
