name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar EPG
        run: python build_epg.py

      - name: Guardar guide.xml
        run: |
          git config user.name "epg-bot"
          git config user.email "actions@github.com"
          git add guide.xml
          git diff --cached --quiet || git commit -m "Actualizar EPG"
          git push
